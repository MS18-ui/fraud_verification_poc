domain: supplementary
description: >
  Additional deterministic rules (A-I). These do NOT replace the primary
  identity/owner/account outcomes -- they either (a) raise a monitoring flag
  with no outcome change, or (b) apply a hard "ceiling"/"override" to a
  domain outcome, as marked by `effect`. Apply AFTER the three primary
  domains have been evaluated.
outcome_rank: { verified: 2, review: 1, fail: 0 }

rules:
  # A. Cross-vendor agreement
  - id: A1_CROSS_VENDOR_NAME_DISAGREEMENT
    category: cross_vendor_agreement
    condition: { type: computed, function: cross_vendor_name_disagreement }
    effect: { type: flag_only }

  - id: A2_ADDRESS_MATCH_CONFLICT
    category: cross_vendor_agreement
    condition:
      all:
        - { field: owner.address_match, op: eq, value: true }
        - { field: owner.ekata_address_match_to_name, op: eq, value: "No match" }
    effect: { type: flag_only }

  # B. SSN / identifier consistency
  - id: B1_SSN_GEOGRAPHY_MISMATCH
    category: ssn_consistency
    condition: { type: computed, function: ssn_geography_mismatch }
    effect: { type: flag_only }

  - id: B2_SSN_ISSUANCE_AGE_ANOMALY
    category: ssn_consistency
    condition: { type: computed, function: ssn_issuance_age_out_of_range, args: { min_age: 14, max_age: 21 } }
    effect: { type: flag_only }

  # C. Address quality
  - id: C1_PO_BOX_OR_FORWARDER
    category: address_quality
    condition:
      any:
        - { field: owner.is_forwarder_address, op: eq, value: true }
        - { field: owner.address_type, op: eq, value: "PO Box" }
    effect: { type: cap_outcome, domain: owner, max_outcome: review }

  - id: C2_NEWLY_REPORTED_CURRENT_ADDRESS
    category: address_quality
    condition: { type: computed, function: current_address_reported_within_days, args: { days: 30 } }
    effect: { type: flag_only }

  - id: C3_HIGH_ADDRESS_CHURN
    category: address_quality
    condition: { field: owner.recent_previous_address_count_90d, op: gte, value: 2 }
    effect: { type: flag_only }

  # D. Phone
  - id: D1_PREPAID_PHONE
    category: phone
    condition: { field: supplementary.prepaid_phone, op: eq, value: true }
    effect: { type: flag_only }

  - id: D2_MOBILE_NO_ADDRESS_MATCH
    category: phone
    condition:
      all:
        - { field: supplementary.phone_match_to_address, op: eq, value: "No match" }
        - { field: supplementary.phone_line_type, op: eq, value: Mobile }
    effect: { type: flag_only }

  - id: D3_BUSINESS_PHONE_ON_PERSONAL_ACCOUNT
    category: phone
    condition:
      all:
        - { field: supplementary.submitted_phone_classification, op: eq, value: Business }
        - { field: supplementary.account_holder_type, op: eq, value: person }
    effect: { type: flag_only }

  # E. Email
  - id: E1_DISPOSABLE_OR_AUTOGENERATED_EMAIL
    category: email
    condition:
      any:
        - { field: supplementary.email_is_disposable, op: eq, value: true }
        - { field: supplementary.email_is_autogenerated, op: eq, value: true }
    effect: { type: cap_outcome, domain: identity, max_outcome: review }

  - id: E2_NEW_EMAIL_NEW_ACCOUNT
    category: email
    condition: { type: computed, function: new_email_new_account, args: { days: 30 } }
    effect: { type: flag_only }

  - id: E3_EMAIL_VELOCITY
    category: email
    condition: { field: supplementary.mailbox_velocity, op: gte, value: 5 }
    effect: { type: flag_only }

  - id: E4_ELEVATED_EMAIL_RISK
    category: email
    condition: { field: supplementary.email_risk_score, op: gte, value: 0.5 }
    effect: { type: flag_only }

  # F. IP / network
  - id: F1_PROXY_DETECTED
    category: ip_network
    condition: { field: supplementary.ip_proxy_risk, op: eq, value: true }
    effect: { type: cap_outcome, domain: identity, max_outcome: review }

  - id: F2_IMPOSSIBLE_TRAVEL
    category: ip_network
    condition:
      all:
        - { field: supplementary.distance_from_primary_address_miles, op: gt, value: 100 }
        - { field: supplementary.distance_from_primary_phone_miles, op: gt, value: 100 }
        - { field: supplementary.travel_alert_on_file, op: eq, value: false }
    effect: { type: flag_only }

  - id: F3_IP_NON_AUTHORITATIVE
    category: ip_network
    condition:
      any:
        - { field: supplementary.ip_error, op: eq, value: Partial }
        - { field: supplementary.ip_warnings, op: contains, value: "private range" }
    effect: { type: exclude_from_decisioning, note: "IP signal marked non-authoritative; monitor only, do not use in OWNER/ACCOUNT decisioning." }

  # G. Watchlist / adverse media (hard stops)
  - id: G1_OFAC_POTENTIAL_MATCH
    category: watchlist
    condition: { field: supplementary.ofac_potential_matches_count, op: gt, value: 0 }
    effect: { type: force_outcome, domain: identity, forced_outcome: fail, escalate: compliance }

  - id: G2_ADVERSE_ALERT_CODE
    category: watchlist
    condition: { field: supplementary.adverse_alert_codes, op: not_empty, value: true }
    effect: { type: cap_outcome, domain: identity, max_outcome: review, note: "Specific high-severity codes may force FAIL -- map against vendor code table; not generic in this ruleset." }

  # H. Account / bank
  - id: H1_DORMANT_ACCOUNT_REACTIVATED
    category: account_bank
    condition: { type: computed, function: dormant_reactivated, args: { dormant_years: 2, reactivated_days: 3 } }
    effect: { type: flag_only }

  - id: H2_ACCOUNT_TYPE_MISMATCH
    category: account_bank
    condition: { type: computed, function: account_type_mismatch }
    effect: { type: flag_only }

  - id: H3_FUNDS_CONFIRMATION_MISSING
    category: account_bank
    condition:
      all:
        - { field: account.funds_confirmation_result, op: exists, value: false }
        - { field: account.verification_response, op: neq, value: Verified }
    effect: { type: cap_outcome, domain: account, max_outcome: review }

  # I. Score-band overlays (tunable -- calibrate against labeled data before use)
  - id: I1_SCORE_BANDS
    category: score_bands
    condition: { type: computed, function: score_band_overlay }
    effect: { type: flag_only, note: "Reference bands: identity_check_score 0-199 fail/200-399 review/400-500 pass; identity_network_score >=0.5 fail/0.30-0.49 review/<0.30 pass; email_risk_score >=0.7 fail/0.4-0.69 review/<0.4 pass." }
